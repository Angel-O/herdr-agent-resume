id = "angel-o.agent-resume"
name = "Agent Resume"
version = "0.1.1"
min_herdr_version = "0.7.5"
description = "Insert or copy resume commands for OpenCode, Codex, Claude Code, and Factory Droid."
platforms = ["macos", "linux"]

[[build]]
command = ["sh", "scripts/install.sh"]

[[actions]]
id = "insert-resume"
title = "Insert agent resume command"
contexts = ["pane"]
command = ["target/release/herdr-agent-resume"]

[[actions]]
id = "copy-resume"
title = "Copy agent resume command"
contexts = ["pane"]
command = ["target/release/herdr-agent-resume"]
